name: PPVGO channel metadata backup
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: write
concurrency:
  group: ppvgo-channel-metadata-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Fetch and validate public channel metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p channel-cache
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 10 --max-time 45 \
            https://api.ppv.st/api/streams -o "$tmp"
          python3 - "$tmp" channel-cache/streams-metadata.json <<'PY'
          import json, sys
          src, dst = sys.argv[1:3]
          with open(src, encoding="utf-8") as f:
              data = json.load(f)
          if not isinstance(data, dict) or data.get("success") is not True:
              raise SystemExit("API response is not a successful JSON object")
          categories = data.get("streams")
          if not isinstance(categories, list) or not categories:
              raise SystemExit("API returned no channel categories; keeping previous snapshot")
          def scrub(value):
              if isinstance(value, dict):
                  return {k: scrub(v) for k, v in value.items()
                          if k.lower() not in {"iframe", "embed", "playback_url", "stream_url", "url"}}
              if isinstance(value, list):
                  return [scrub(v) for v in value]
              return value
          clean = scrub(data)
          clean["_backup"] = {
              "source": "https://api.ppv.st/api/streams",
              "captured_utc": __import__("datetime").datetime.now(
                  __import__("datetime").timezone.utc).isoformat(),
              "note": "Metadata snapshot only. Third-party iframe/playback URLs intentionally excluded."
          }
          with open(dst, "w", encoding="utf-8") as f:
              json.dump(clean, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(f"Saved {len(categories)} categories; iframe/playback URLs excluded.")
          PY
      - name: Commit changed metadata snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add channel-cache/streams-metadata.json
          if git diff --cached --quiet; then
            echo "No metadata changes; previous snapshot retained."
            exit 0
          fi
          git commit -m "Backup PPVGO channel metadata"
          git push
